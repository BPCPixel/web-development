<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Bootstrap 3 - Inicio</title>

    <link rel="stylesheet" href="bootstrap3.4/css/bootstrap.min.css">
</head>
<body">

    <div class="container">
        <h1 class="text-center">Mi primera página con Bootstrap</h1>
        <p class="text-center">Aprendiendo Bootstrap 3 🚀</p>
    </div>
    <hr>
    <div class="container">
        <h3 class="text-center">Tipos de texto</h3>
        <p class="text-left">Izquierda</p>
        <p class="text-center">Centro</p>
        <p class="text-right">Derecha</p>
    </div>
    <hr>

    <div class="container text-center">
        <h3 class="text-center">Colores</h3>
        <p class="text-primary">Texto azul</p>
        <p class="text-success">Texto verde</p>
        <p class="text-danger">Texto rojo</p>
    </div>
    <hr>

    <div class="container text-center">
        <h3>Botones</h3>
        <button class="btn btn-primary">Primary</button>
        <button class="btn btn-success">Succes</button>
        <button class="btn btn-danger">Danger</button>
    </div>
    <hr>

    <div class="container text-center">
        <button id="miBoton" class="btn btn-primary">Haz clic</button>
    </div>
    
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Bootstrap JS -->
    <script src="bootstrap/js/bootstrap.min.js"></script>

    <script>
        $("#miBoton").click(function() { alert("Funciona 🚀"); });
    </script>

</body>
</html>
