<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Task Manager</title>
        <link rel="stylesheet" href="bootstrap-3.4.1-dist/css/bootstrap.min.css">
        
        <!--Adding normalize sheet and preload-->
        <link rel="preload" href="css/normalize.css" as="style">
        <link rel="stylesheet" href="css/normalize.css">

        <!--Adding styles sheet and preload-->
        <link rel="preload" href="css/styles.css" as="style">
        <link rel="stylesheet" href="css/styles.css">

    </head>
    <body>

        <div class="container text-center">
            <h1 class="Task_title">Task Manager</h1>
        </div>
        <hr>  
        <br>
        <div class="tasks container">
            <!-- TASK -->
            <label>TASK: </label>
            <input id="input-form" class="form-control" type="text" placeholder="Write a task">
            <!-- BUTTON -->
            <br>
            <button id="button-form" class="btn btn-primary">Add Task</button>
            <!-- TASK LIST -->
            <br>
            <ul id="list-form" class="list-group">
                
            </ul>
            
        </div>
        <br>
        
    <hr>
        <footer class="text-center">
            <p><small>All rights reserved | Eduardo Téllez 2026 &copy; </small></p>
        </footer>
        <!-- jQuery -->
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="bootstrap-3.4.1-dist/js/bootstrap.min.js"></script>
        <!-- My JS code -->
        <script>        
            let input = document.getElementById('input-form');
            let button = document.getElementById('button-form');
            let list = document.getElementById('list-form');

            let counter = 1;

            button.addEventListener("click", function() {
                // Declaro una variable value para capturar el valor del input
                let value = input.value;

                if(value.trim() === ""){
                    alert("Please write a task");
                    return;
                }

                // Si el usuario ingresa un valor se crea una lista
                let li = document.createElement("li"); // se crea el primer valor de la lista
                li.textContent = counter + ". "+ value;
                li.className = "list-group-item";

                list.appendChild(li);

                counter ++;

                input.value = "";
            });
        </script>
    </body>
</html>
