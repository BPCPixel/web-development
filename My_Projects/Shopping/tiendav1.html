<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Compras</title>

    <link rel="stylesheet" href="bootstrap3.4/css/bootstrap.min.css">
</head>

<body>

    <div class="container">
        <h1 class="text-center">Carrito</h1>

        <hr>

        <div class="form-group">
            <label>Agregar producto:</label>
            <input type="text" id="inputProducto" class="form-control" placeholder="leche, pan...">
        </div>

        <button id="btnAgregar" class="btn btn-primary">Agregar</button>

        <hr>

        <div id="lista"></div>

    </div>

    <script>
        let listaCompras = [];

        const input = document.getElementById("inputProducto");
        const btnAgregar = document.getElementById("btnAgregar");
        const lista = document.getElementById("lista");

        btnAgregar.addEventListener("click", function() {
            let texto = input.value;

            if (texto.trim() === "") {
                alert("Escribe un producto");
                return;
            }

            let producto = {
                nombre: texto,
                comprado: false
            };

            listaCompras.push(producto);
            input.value = "";

            mostrarLista();
        });

        function mostrarLista() {
            lista.innerHTML = "";

            listaCompras.forEach(function(item, index) {

                let div = document.createElement("div");
                div.className = "panel panel-default";

                div.innerHTML = `
                    <div class="panel-body">
                        <strong style="text-decoration: ${item.comprado ? 'line-through' : 'none'};">
                            ${item.nombre}
                        </strong>
                        <br><br>

                        <button class="btn btn-success btn-sm btn-comprado">Comprado</button>
                        <button class="btn btn-info btn-sm btn-editar">Editar</button>
                        <button class="btn btn-danger btn-sm btn-eliminar">Eliminar</button>
                    </div>
                `;

                
                div.querySelector(".btn-comprado").addEventListener("click", function() {
                    listaCompras[index].comprado = !listaCompras[index].comprado;
                    mostrarLista();
                });

                
                div.querySelector(".btn-editar").addEventListener("click", function() {
                    let nuevo = prompt("Editar producto:", item.nombre);

                    if (nuevo !== null && nuevo.trim() !== "") {
                        listaCompras[index].nombre = nuevo;
                        mostrarLista();
                    }
                });

                div.querySelector(".btn-eliminar").addEventListener("click", function() {
                    listaCompras.splice(index, 1);
                    mostrarLista();
                });

                lista.appendChild(div);
            });
        }
    </script>

</body>
</html>
