<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eduardo Market</title>
    <link rel="stylesheet" href="bootstrap3.4/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<nav class="navbar-custom">
    <div class="container">
        <div class="row">
            <div class="col-xs-6">
                <h2 class="logo">Eduardo Market</h2>
                <p class="subtitulo">Los mejores precios</p>
            </div>

            <div class="col-xs-6 text-right carrito-area">
                <div class="carrito-box" id="abrirCarrito">
                     Carrito <span id="contador" class="contador">0</span>
                </div>

                <div id="miniCarrito" class="mini-carrito"></div>
            </div>
        </div>
    </div>
</nav>

<header class="hero-section text-center">
    <div class="container">
        <h1>Bienvenido a Eduardo Market</h1>
        <p>Productos seleccionados con la mejor calidad</p>
    </div>
</header>

<div class="container">
    <div class="row">

        <div class="col-md-4">
            <div class="producto-card">
                <img src="https://images.unsplash.com/photo-1563636619-e9143da7973b" class="producto-img">
                <h3>Leche</h3>
                <p class="precio">$25</p>
                <button class="btn-premium agregar">Agregar</button>
            </div>
        </div>

        <div class="col-md-4">
            <div class="producto-card">
                <img src="https://images.unsplash.com/photo-1509440159596-0249088772ff" class="producto-img">
                <h3>Pan</h3>
                <p class="precio">$30</p>
                <button class="btn-premium agregar">Agregar</button>
            </div>
        </div>

        <div class="col-md-4">
            <div class="producto-card">
                <img src="https://images.unsplash.com/photo-1587486913049-53fc88980cfc" class="producto-img">
                <h3>Huevos</h3>
                <p class="precio">$50</p>
                <button class="btn-premium agregar">Agregar</button>
            </div>
        </div>

        <div class="col-md-4">
            <div class="producto-card">
                <img src="https://images.unsplash.com/photo-1586201375761-83865001e31c" class="producto-img">
                <h3>Arroz</h3>
                <p class="precio">$20</p>
                <button class="btn-premium agregar">Agregar</button>
            </div>
        </div>

        <div class="col-md-4">
            <div class="producto-card">
                <img src="https://images.unsplash.com/photo-1515543904379-3d757afe72e4" class="producto-img">
                <h3>Frijoles</h3>
                <p class="precio">$28</p>
                <button class="btn-premium agregar">Agregar</button>
            </div>
        </div>

        <div class="col-md-4">
            <div class="producto-card">
                <img src="https://images.unsplash.com/photo-1622484212850-eb596d769edc" class="producto-img">
                <h3>Chocolate</h3>
                <p class="precio">$18</p>
                <button class="btn-premium agregar">Agregar</button>
            </div>
        </div>

    </div>
</div>

<script>
let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
const botones = document.querySelectorAll(".agregar");
const contador = document.getElementById("contador");
const mini = document.getElementById("miniCarrito");
const abrirCarrito = document.getElementById("abrirCarrito");

function guardar() {
    localStorage.setItem("carrito", JSON.stringify(carrito));
}

function actualizarContador() {
    let total = 0;
    carrito.forEach(function(p){ total += p.cantidad; });
    contador.textContent = total;
}

function renderMiniCarrito() {
    if (carrito.length === 0) {
        mini.innerHTML = "<p class='mini-vacio'>Tu carrito está vacío</p>";
        return;
    }

    let html = "<h4>Tu carrito</h4>";
    let total = 0;

    carrito.forEach(function(item, i){
        let subtotal = item.precio * item.cantidad;
        total += subtotal;

        html += `
        <div class="mini-item">
            <strong>${item.nombre}</strong>
            <p>$${subtotal}</p>
            <button onclick="sumar(${i})">+</button>
            <button onclick="restar(${i})">-</button>
            <button onclick="eliminar(${i})">x</button>
        </div>`;
    });

    html += `
    <hr>
    <h4>Total: $${total}</h4>
    <button class="btn-premium" onclick="window.location.href='carrito.html'">Ver carrito</button>
    <button class="btn-finalizar" onclick="comprarDirecto()">Comprar</button>
    `;

    mini.innerHTML = html;
}

function sumar(i){ carrito[i].cantidad++; guardar(); actualizarContador(); renderMiniCarrito(); }
function restar(i){ carrito[i].cantidad--; if(carrito[i].cantidad<=0) carrito.splice(i,1); guardar(); actualizarContador(); renderMiniCarrito(); }
function eliminar(i){ carrito.splice(i,1); guardar(); actualizarContador(); renderMiniCarrito(); }

function comprarDirecto(){
    window.location.href = "carrito.html";
}

botones.forEach(function(boton){
    boton.addEventListener("click", function(){
        let nombre = boton.parentElement.querySelector("h3").textContent;
        let precio = parseFloat(boton.parentElement.querySelector(".precio").textContent.replace("$",""));

        let existe = carrito.find(function(p){ return p.nombre === nombre; });

        if(existe){ existe.cantidad++; }
        else{ carrito.push({nombre:nombre, precio:precio, cantidad:1}); }

        guardar();
        actualizarContador();
        renderMiniCarrito();
    });
});

abrirCarrito.addEventListener("click", function(){
    if(mini.style.display === "block"){
        mini.style.display = "none";
    } else {
        renderMiniCarrito();
        mini.style.display = "block";
    }
});

actualizarContador();
</script>

</body>
</html>
