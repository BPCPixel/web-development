<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tienda - Lista de Compras</title>

    <link rel="stylesheet" href="bootstrap3.4/css/bootstrap.min.css">

    <style>
        .producto {
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="clearfix">
        <h1 class="pull-left">Tienda</h1>
        <h3 class="pull-right" id="irCarrito" style="cursor:pointer;">
            🛒 Carrito: <span id="contador">0</span>
        </h3>
    </div>

    <hr>

    <!-- PRODUCTOS -->
    <div class="row">

        <!-- 9 PRODUCTOS -->
        <div class="col-md-4"><div class="panel panel-default producto"><div class="panel-body text-center"><h4>Leche</h4><p>$25</p><button class="btn btn-primary btn-block agregar">Agregar</button></div></div></div>
        <div class="col-md-4"><div class="panel panel-default producto"><div class="panel-body text-center"><h4>Pan</h4><p>$30</p><button class="btn btn-primary btn-block agregar">Agregar</button></div></div></div>
        <div class="col-md-4"><div class="panel panel-default producto"><div class="panel-body text-center"><h4>Huevos</h4><p>$50</p><button class="btn btn-primary btn-block agregar">Agregar</button></div></div></div>

        <div class="col-md-4"><div class="panel panel-default producto"><div class="panel-body text-center"><h4>Arroz</h4><p>$20</p><button class="btn btn-primary btn-block agregar">Agregar</button></div></div></div>
        <div class="col-md-4"><div class="panel panel-default producto"><div class="panel-body text-center"><h4>Frijoles</h4><p>$28</p><button class="btn btn-primary btn-block agregar">Agregar</button></div></div></div>
        <div class="col-md-4"><div class="panel panel-default producto"><div class="panel-body text-center"><h4>Jugo</h4><p>$18</p><button class="btn btn-primary btn-block agregar">Agregar</button></div></div></div>

        <div class="col-md-4"><div class="panel panel-default producto"><div class="panel-body text-center"><h4>Manzanas</h4><p>$35</p><button class="btn btn-primary btn-block agregar">Agregar</button></div></div></div>
        <div class="col-md-4"><div class="panel panel-default producto"><div class="panel-body text-center"><h4>Plátanos</h4><p>$22</p><button class="btn btn-primary btn-block agregar">Agregar</button></div></div></div>
        <div class="col-md-4"><div class="panel panel-default producto"><div class="panel-body text-center"><h4>Queso</h4><p>$60</p><button class="btn btn-primary btn-block agregar">Agregar</button></div></div></div>

    </div>

</div>

<script>

    let carrito = JSON.parse(localStorage.getItem("carrito")) || [];

    const botones = document.querySelectorAll(".agregar");
    const contador = document.getElementById("contador");
    const irCarrito = document.getElementById("irCarrito");

    // Aqui muestra el contador al cargar
    contador.textContent = carrito.length;

    // Agregar productos
    botones.forEach(function(boton) {
        boton.addEventListener("click", function() {

            let nombre = boton.parentElement.querySelector("h4").textContent;

            carrito.push(nombre);

            localStorage.setItem("carrito", JSON.stringify(carrito));

            contador.textContent = carrito.length;
        });
    });

    // Ir al carrito
    irCarrito.addEventListener("click", function() {
        window.location.href = "carrito.html";
    });

</script>

</body>
</html>
