<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tienda - Lista de Compras</title>

    <link rel="stylesheet" href="bootstrap3.4/css/bootstrap.min.css">

    <style>
        .producto {
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="clearfix">
        <h1 class="pull-left">Tienda</h1>
        <h3 class="pull-right">
            🛒 Carrito: <span id="contador">0</span>
        </h3>
    </div>

    <hr>

    <!-- PRODUCTOS -->
    <div class="row">

        <div class="col-md-4">
            <div class="panel panel-default producto">
                <div class="panel-body text-center">
                    <h4>Leche</h4>
                    <p>$25</p>
                    <button class="btn btn-primary btn-block agregar">Agregar</button>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="panel panel-default producto">
                <div class="panel-body text-center">
                    <h4>Pan</h4>
                    <p>$30</p>
                    <button class="btn btn-primary btn-block agregar">Agregar</button>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="panel panel-default producto">
                <div class="panel-body text-center">
                    <h4>Huevos</h4>
                    <p>$50</p>
                    <button class="btn btn-primary btn-block agregar">Agregar</button>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="panel panel-default producto">
                <div class="panel-body text-center">
                    <h4>Arroz</h4>
                    <p>$20</p>
                    <button class="btn btn-primary btn-block agregar">Agregar</button>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="panel panel-default producto">
                <div class="panel-body text-center">
                    <h4>Frijoles</h4>
                    <p>$28</p>
                    <button class="btn btn-primary btn-block agregar">Agregar</button>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="panel panel-default producto">
                <div class="panel-body text-center">
                    <h4>Jugo</h4>
                    <p>$18</p>
                    <button class="btn btn-primary btn-block agregar">Agregar</button>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="panel panel-default producto">
                <div class="panel-body text-center">
                    <h4>Manzanas</h4>
                    <p>$35</p>
                    <button class="btn btn-primary btn-block agregar">Agregar</button>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="panel panel-default producto">
                <div class="panel-body text-center">
                    <h4>Plátanos</h4>
                    <p>$22</p>
                    <button class="btn btn-primary btn-block agregar">Agregar</button>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="panel panel-default producto">
                <div class="panel-body text-center">
                    <h4>Queso</h4>
                    <p>$60</p>
                    <button class="btn btn-primary btn-block agregar">Agregar</button>
                </div>
            </div>
        </div>

    </div>

    <hr>

    <h3>Productos en carrito</h3>
    <div id="lista"></div>

</div>

<script>

    let carrito = [];

    const botones = document.querySelectorAll(".agregar");
    const lista = document.getElementById("lista");
    const contador = document.getElementById("contador");

    // AGREGAR
    botones.forEach(function(boton) {
        boton.addEventListener("click", function() {

            let nombre = boton.parentElement.querySelector("h4").textContent;

            carrito.push(nombre);

            mostrarCarrito();
        });
    });

    // MOSTRAR 
    function mostrarCarrito() {
        lista.innerHTML = "";

        contador.textContent = carrito.length;

        carrito.forEach(function(item, index) {

            let div = document.createElement("div");
            div.className = "panel panel-default";

            div.innerHTML = `
                <div class="panel-body">
                    ${item}
                    <button class="btn btn-danger btn-sm pull-right eliminar">Eliminar</button>
                </div>
            `;

            // ELIMINAR
            div.querySelector(".eliminar").addEventListener("click", function() {
                carrito.splice(index, 1);
                mostrarCarrito();
            });

            lista.appendChild(div);
        });
    }

</script>

</body>
</html>
