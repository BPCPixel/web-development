<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Carrito - Nova Market</title>
    <link rel="stylesheet" href="bootstrap3.4/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="container carrito-page">
    <h1 class="titulo-carrito text-center">Resumen de Compra</h1>
    <div id="lista"></div>
    <h2 id="total" class="total-carrito"></h2>

    <div class="text-center">
        <button class="btn-premium" onclick="volver()">Volver</button>
        <button class="btn-finalizar" onclick="comprar()">Comprar Ahora</button>
    </div>
</div>

<script>
let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
const lista = document.getElementById("lista");
const totalTexto = document.getElementById("total");

function mostrarCarrito(){
    lista.innerHTML = "";
    let total = 0;

    carrito.forEach(function(item, i){
        let subtotal = item.precio * item.cantidad;
        total += subtotal;

        lista.innerHTML += `
        <div class="item-carrito">
            <h3>${item.nombre}</h3>
            <p>Cantidad: ${item.cantidad}</p>
            <p>Precio unitario: $${item.precio}</p>
            <p>Subtotal: $${subtotal}</p>
        </div>`;
    });

    totalTexto.textContent = "Total: $" + total;
}

function volver(){ window.location.href="index.html"; }

function comprar(){
    let subtotal = 0;
    let detalle = "";

    carrito.forEach(function(item){
        let sub = item.precio * item.cantidad;
        subtotal += sub;
        detalle += item.nombre + " x" + item.cantidad + " - $" + sub + "\n";
    });

    let iva = subtotal * 0.16;
    let total = subtotal + iva;

    let ticket =
    "------ TICKET DE COMPRA ------\n\n" +
    detalle +
    "\nSubtotal: $" + subtotal.toFixed(2) +
    "\nIVA: $" + iva.toFixed(2) +
    "\nTOTAL: $" + total.toFixed(2) +
    "\n\nGracias por comprar en Nova Market";

    alert(ticket);

    localStorage.removeItem("carrito");
    carrito = [];
    mostrarCarrito();
}

mostrarCarrito();
</script>

</body>
</html>
