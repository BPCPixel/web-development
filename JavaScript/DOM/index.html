<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM example with JavaScript</title>
</head>
<body>
   
    <h1 id="header">DOM Example with JavaScript</h1>
    <p id="paragraph">Hello, Everyone!</p>

    <script>
        let header = document.getElementById('header').innerHTML;
        console.log('Header value: ' + header);
        let paragraph = document.getElementById('paragraph').innerHTML;
        console.log('Paragraph: ' + paragraph);
    </script>

</body>
</html>
